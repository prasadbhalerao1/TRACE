# TRACE — Local Infrastructure Services
# Note: Production & Active Dev use Cloud Providers configured in .env:
# - PostgreSQL: Managed Neon Cloud Postgres (DATABASE_URL)
# - Vector DB: Managed Qdrant Cloud (QDRANT_URL)
# - Redis: Local Docker Container (port 6379)

services:
  redis:
    image: redis:7-alpine
    container_name: dataaxle_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Optional local fallback services for offline development
  postgres:
    profiles: ["offline"]
    image: postgres:16-alpine
    container_name: dataaxle_postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: talent_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    profiles: ["offline"]
    image: qdrant/qdrant
    container_name: dataaxle_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
